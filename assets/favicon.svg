<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <radialGradient id="favStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0" />
    </radialGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded Card Background -->
  <rect width="64" height="64" rx="16" fill="#0b0c16" stroke="url(#favGrad)" stroke-width="2" />

  <!-- Futuristic ST Icon Body -->
  <g filter="url(#favGlow)">
    <!-- Tech S -->
    <path d="M 18,18 L 44,18 L 44,24 L 26,24 L 20,32 L 38,32 L 30,44 L 20,44 L 14,34 Z" fill="url(#favGrad)" />
    <path d="M 32,38 L 42,38 L 50,48 L 38,48 L 26,48 L 32,38 Z" fill="url(#favGrad)" opacity="0.9" />
    
    <!-- Tech T Integration Accent -->
    <path d="M 44,18 L 52,18 L 52,24 L 46,24 L 46,38 L 40,38 L 40,24 Z" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Top-Right Sparkle -->
  <g transform="translate(50, 14)">
    <circle cx="0" cy="0" r="5" fill="url(#favStarGlow)" />
    <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="#ffffff" />
  </g>
</svg>
